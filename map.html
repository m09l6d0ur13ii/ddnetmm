<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Leaderboard</title>
  <link rel="icon" type="image/png" href="icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ffa500',
          }
        }
      }
    }
  </script>
</head>
<body class="antialiased text-slate-200 font-sans min-h-screen" style="background-color:#2d2d2d;">
  <div id="header-container"></div>

  <main class="min-h-screen p-4 md:p-8 animate-fade-in">
    <div id="loading" class="text-center py-20 max-w-4xl mx-auto">
      <div id="loader-icon" class="inline-block text-primary"></div>
      <p class="mt-4 text-slate-400" id="map-loading"></p>
    </div>

    <div id="error" class="hidden max-w-4xl mx-auto">
      <a href="index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-primary mb-8 transition-colors">
        <span id="icon-arrow-left-err"></span> <span id="map-back-err"></span>
      </a>
      <div class="bg-slate-900/50 p-8 rounded-xl border border-slate-800 text-center text-slate-400" id="map-error">
      </div>
    </div>

    <div id="content" class="hidden max-w-5xl mx-auto space-y-8">
      <a href="index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition-colors">
        <span id="icon-arrow-left"></span> <span id="map-back"></span>
      </a>

      <header class="space-y-2">
        <h1 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400" id="map-name"></h1>
        <p class="text-primary font-medium tracking-wide uppercase text-sm" id="map-leaderboard-title"></p>
      </header>

      <div id="enriched-banner" class="hidden glass-panel p-4 rounded-xl border border-amber-500/40 bg-amber-500/10 flex items-center gap-3 text-amber-300 text-sm font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-400 shrink-0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <span id="enriched-banner-text"></span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="glass-panel p-6 flex items-center gap-6 transition-transform cursor-default">
          <div style="padding:0.75rem;background:rgba(255,165,0,0.08);border:1px solid rgba(255,165,0,0.2);">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#ffa500;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          </div>
          <div>
            <div class="text-sm text-slate-400 uppercase tracking-wider font-semibold mb-1" id="stat-record"></div>
            <div class="text-3xl font-bold font-mono text-white drop-shadow-md" id="val-tbest"></div>
          </div>
        </div>
        <div class="glass-panel p-6 flex items-center gap-6 transition-transform cursor-default">
          <div style="padding:0.75rem;background:rgba(255,165,0,0.08);border:1px solid rgba(255,165,0,0.2);">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#ffa500;"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
          </div>
          <div>
            <div class="text-sm text-slate-400 uppercase tracking-wider font-semibold mb-1" id="stat-s"></div>
            <div class="text-3xl font-bold font-mono text-white drop-shadow-md" id="val-s"></div>
          </div>
        </div>
      </div>

      <div class="glass-panel overflow-hidden mt-8">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse whitespace-nowrap">
            <thead>
              <tr class="bg-white/[0.02] border-b border-white/[0.05] text-slate-400 text-sm tracking-wide">
                <th class="p-4 font-semibold" id="table-rank"></th>
                <th class="p-4 font-semibold" id="table-player"></th>
                <th class="p-4 font-semibold" id="table-time"></th>
                <th class="p-4 font-semibold" id="table-gap"></th>
                <th class="p-4 font-semibold text-emerald-400 text-right" id="table-pts"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800/50" id="map-body">
            </tbody>
          </table>
        </div>
        <div id="load-more-container" class="hidden p-4 border-t border-slate-800 text-center bg-slate-900/50">
          <button id="btn-load-more" class="px-6 py-2 bg-primary/20 text-primary border border-primary/50 hover:bg-primary/30 rounded-full font-semibold transition-colors"></button>
        </div>
      </div>
    </div>
  </main>

  <script src="data/maps.js"></script>
  <script src="data/leaderboard.js"></script>
  <script src="data/map_records.js"></script>
  <script src="data/map_rankings.js"></script>
  <script src="data/map_enriched.js"></script>
  <script src="data/map_min_times.js"></script>
  <script src="data/ignored_finishes.js"></script>
  <script src="data/map_stats.js"></script>
  <script src="data/blacklist.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      renderHeader('map');
      const dict = getDict();
      
      const urlParams = new URLSearchParams(window.location.search);
      const mapQuery = urlParams.get('name');

      if (!mapQuery) {
        window.location.href = 'index.html';
        return;
      }

      document.title = `Map: ${mapQuery} - DDNet Map Mastery`;

      const arrowLeftHtml = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>';
      document.getElementById('icon-arrow-left').innerHTML = arrowLeftHtml;
      document.getElementById('icon-arrow-left-err').innerHTML = arrowLeftHtml;
      document.getElementById('loader-icon').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-12 h-12 animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>';

      document.getElementById('map-back').textContent = dict.map.back;
      document.getElementById('map-back-err').textContent = dict.map.back;
      document.getElementById('map-loading').textContent = dict.map.loading;
      document.getElementById('map-error').textContent = dict.map.mapNotFound;
      document.getElementById('stat-record').textContent = dict.map.statRecord;
      document.getElementById('stat-s').textContent = dict.map.statS;
      document.getElementById('map-leaderboard-title').textContent = dict.map.title;
      
      document.getElementById('table-rank').textContent = dict.map.tableRank;
      document.getElementById('table-player').textContent = dict.map.tablePlayer;
      document.getElementById('table-time').textContent = dict.map.tableTime;
      document.getElementById('table-gap').textContent = dict.map.tableGap;
      document.getElementById('table-pts').textContent = dict.map.tablePts;

      const formatTime = (t) => {
        if (t <= 0) return '-';
        const m = Math.floor(t / 60);
        const s = (t % 60).toFixed(2);
        return `${m}:${s.padStart(5, '0')}`;
      };

      const getGapBadgeHtml = (gapPct) => {
        const gapStr = '+' + gapPct.toFixed(1) + '%';
        let bg, color, border;
        
        if (gapPct <= 5.0) {
          // Green (0% - 5%)
          bg = 'rgba(16, 185, 129, 0.25)';
          color = '#34d399';
          border = '1px solid rgba(16, 185, 129, 0.5)';
        } else if (gapPct <= 25.0) {
          // Lime / Yellow (5% - 25%)
          bg = 'rgba(234, 179, 8, 0.25)';
          color = '#fde047';
          border = '1px solid rgba(234, 179, 8, 0.5)';
        } else if (gapPct <= 60.0) {
          // Orange (25% - 60%)
          bg = 'rgba(249, 115, 22, 0.25)';
          color = '#ffab70';
          border = '1px solid rgba(249, 115, 22, 0.5)';
        } else if (gapPct <= 100.0) {
          // Coral / Soft Red-Orange (60% - 100%)
          bg = 'rgba(244, 63, 94, 0.25)';
          color = '#fca5a5';
          border = '1px solid rgba(244, 63, 94, 0.5)';
        } else {
          // Soft Muted Red (>= 100%)
          bg = 'rgba(239, 68, 68, 0.25)';
          color = '#f87171';
          border = '1px solid rgba(239, 68, 68, 0.5)';
        }

        return `<span style="background:${bg};color:${color};border:${border};padding:0.2em 0.6em;border-radius:2px;font-weight:700;font-family:monospace;font-size:0.85em;display:inline-block;">${gapStr}</span>`;
      };

      const loadMapData = async (limit) => {
        try {
          const data = await window.api.getMapLeaderboardLive(mapQuery, limit);
          
          document.getElementById('map-name').textContent = data.mapName;
          document.getElementById('val-tbest').textContent = formatTime(data.tBest);
          document.getElementById('val-s').textContent = data.s.toFixed(2);

          const isEnriched = window.enrichedMapsData && (window.enrichedMapsData[data.mapName] || window.enrichedMapsData[mapQuery]);
          const bannerEl = document.getElementById('enriched-banner');
          if (isEnriched && bannerEl) {
            document.getElementById('enriched-banner-text').textContent = dict.map.enrichedBanner;
            bannerEl.classList.remove('hidden');
          } else if (bannerEl) {
            bannerEl.classList.add('hidden');
          }

          const tbody = document.getElementById('map-body');
          tbody.innerHTML = '';
          
          data.leaderboard.forEach((row, idx) => {
            const tr = document.createElement('tr');
            tr.className = "premium-table-row transition-colors";
            
            const gapPct = Math.max(0, (row.timeRatio - 1) * 100);
            
            // Premium rank styling
            let rankHtml = `<span class="text-slate-400 font-mono font-bold">#${idx + 1}</span>`;
            if (idx === 0) rankHtml = `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/50 px-2 py-0.5 rounded font-bold text-sm shadow-[0_0_10px_rgba(251,191,36,0.3)]">#1</span>`;
            if (idx === 1) rankHtml = `<span class="bg-slate-300/20 text-slate-300 border border-slate-300/50 px-2 py-0.5 rounded font-bold text-sm">#2</span>`;
            if (idx === 2) rankHtml = `<span class="bg-amber-700/20 text-amber-600 border border-amber-700/50 px-2 py-0.5 rounded font-bold text-sm">#3</span>`;

            tr.innerHTML = `
              <td class="p-4">${rankHtml}</td>
              <td class="p-4 font-bold text-lg">
                <a href="player.html?name=${encodeURIComponent(row.player)}" class="text-white hover:text-amber-400 transition-colors">
                  ${escapeHtml(row.player)}
                </a>
              </td>
              <td class="p-4 font-mono text-slate-100 font-medium">${formatTime(row.time)}</td>
              <td class="p-4">
                ${getGapBadgeHtml(gapPct)}
              </td>
              <td class="p-4 font-bold text-emerald-400 text-right text-lg">${row.pSkill}</td>
            `;
            tbody.appendChild(tr);
          });

          if (limit < 100 && data.leaderboard.length >= limit) {
            document.getElementById('load-more-container').classList.remove('hidden');
            const btn = document.getElementById('btn-load-more');
            btn.textContent = currentLang === 'en' ? 'Load Top 100' : 'Загрузить Топ 100';
            btn.onclick = () => {
              btn.textContent = '...';
              loadMapData(100);
            };
          } else {
            document.getElementById('load-more-container').classList.add('hidden');
          }

          document.getElementById('loading').classList.add('hidden');
          document.getElementById('error').classList.add('hidden');
          document.getElementById('content').classList.remove('hidden');

        } catch (e) {
          console.error(e);
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('error').classList.remove('hidden');
        }
      };

      loadMapData(20);
    });
  </script>
</body>
</html>
