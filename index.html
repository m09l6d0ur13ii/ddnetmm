<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDNet Map Mastery PTS</title>
  <link rel="icon" type="image/png" href="icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ffa500', // DDNet orange
          }
        }
      }
    }
  </script>
</head>
<body class="antialiased text-slate-200 font-sans min-h-screen" style="background-color:#2d2d2d;">
  <div id="header-container"></div>

  <main class="p-4 md:p-8 animate-fade-in">
    <header class="max-w-7xl mx-auto mb-12 text-center space-y-4">
      <div style="display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem;" id="icon-trophy">
        <img src="icon.png" alt="Logo" style="width:64px;height:64px;object-fit:contain;">
      </div>
      <h1 class="text-5xl md:text-7xl font-black tracking-tight bg-gradient-to-br from-white via-slate-200 to-slate-500 bg-clip-text text-transparent drop-shadow-sm" id="home-title">
      </h1>
      <p class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto" id="home-subtitle">
      </p>
      <div class="pt-4 flex flex-wrap justify-center gap-4">
        <a href="about.html" style="display:inline-flex;align-items:center;gap:0.5em;padding:0.6em 1.4em;border:1px solid rgba(255,255,255,0.15);font-size:0.875em;font-weight:500;color:#dfdede;text-decoration:none;" onmouseover="this.style.borderColor='#ffa500';this.style.color='#ffa500'" onmouseout="this.style.borderColor='rgba(255,255,255,0.15)';this.style.color='#dfdede'">
          <span id="home-about-btn"></span> <span id="icon-arrow-right-1"></span>
        </a>
        <a href="compare.html" style="display:inline-flex;align-items:center;gap:0.5em;padding:0.6em 1.4em;border:1px solid rgba(255,165,0,0.5);font-size:0.875em;font-weight:500;color:#ffa500;text-decoration:none;" onmouseover="this.style.borderColor='#ffa500'" onmouseout="this.style.borderColor='rgba(255,165,0,0.5)'">
          <span id="home-compare-btn"></span> <span id="icon-arrow-right-2"></span>
        </a>
      </div>
    </header>

    <section class="max-w-7xl mx-auto mb-12 glass-panel p-8">
      <h2 class="text-2xl font-bold mb-6 text-white border-b border-slate-800 pb-4" id="home-how-it-works"></h2>
      <div class="grid md:grid-cols-2 gap-8">
        <div class="space-y-6 text-slate-300">
          <div class="bg-slate-900/50 p-4 rounded-lg flex items-center justify-center overflow-x-auto" id="math-1"></div>
          <div class="space-y-2">
            <p><strong id="home-base-pts-title"></strong>: <span id="home-base-pts-desc"></span></p>
            <div class="bg-slate-900/50 p-2 rounded-lg text-center" id="math-2"></div>
          </div>
        </div>

        <div class="space-y-4 text-slate-300">
          <p>
            <strong id="home-skill-pts-title"></strong>: <span id="home-skill-pts-desc"></span>
            <span id="math-3"></span> <span id="home-skill-pts-and"></span> <span id="math-4"></span>.
          </p>
          <div class="bg-slate-900/50 p-4 rounded-lg overflow-x-auto" id="math-5"></div>
          <p class="text-sm text-slate-400">
            <span id="home-skill-pts-where"></span> <span id="math-6"></span> <span id="home-skill-pts-and2"></span> <span id="math-7"></span> — <span id="home-skill-pts-s-desc"></span>
          </p>
        </div>
      </div>
    </section>

    <div class="grid md:grid-cols-3 gap-8 max-w-7xl mx-auto">
      <section class="glass-panel p-8 h-fit md:col-span-1 space-y-6">
        <h2 class="text-xl font-bold" id="search-title">Найти игрока</h2>
        <form id="player-search-form" class="flex gap-2">
          <input
            type="text"
            id="search-input"
            placeholder="m09l6d0ur13ii.."
            class="flex-1 bg-white/[0.03] border border-white/10 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary text-slate-100 placeholder:text-slate-500"
          />
          <button
            type="submit"
            id="search-btn"
            class="bg-primary hover:bg-blue-600 transition-colors rounded-md p-2 flex items-center justify-center disabled:opacity-50"
          >
          </button>
        </form>

        <p id="search-error" class="text-red-400 text-sm hidden"></p>

        <div id="search-result" style="background:#222222;border:2px solid #ffa500;padding:1.1rem;box-shadow:0 4px 16px rgba(0,0,0,0.6);" class="space-y-3 hidden">
          <h3 class="font-bold text-xl">
            <a id="search-result-name" href="#" class="text-primary hover:text-amber-300 hover:underline transition-colors"></a>
          </h3>
          <div class="grid grid-cols-2 gap-2 text-sm">
            <span class="text-slate-200 font-semibold">New Base:</span>
            <span id="search-result-base" class="font-mono text-right text-emerald-400 font-bold"></span>
            <span class="text-slate-200 font-semibold">New Skill:</span>
            <span id="search-result-skill" class="font-mono text-right text-purple-400 font-bold"></span>
            <div class="col-span-2 h-px bg-white/10 my-1"></div>
            <span class="font-bold text-white">Total Map Mastery:</span>
            <span id="search-result-total" class="font-mono font-bold text-right text-amber-400 text-lg"></span>
          </div>
        </div>
      </section>

      <section class="glass-panel p-8 md:col-span-2">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 border-b border-white/[0.05] pb-4">
          <div class="flex items-center gap-3 flex-wrap">
            <!-- Global Rank Tab Button -->
            <button
              id="tab-btn-global"
              onclick="switchMainTab('global')"
              style="padding:0.4em 1em;font-size:1.1em;font-weight:bold;background:#ffa500;color:#111111;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:0.4em;box-shadow:0 2px 8px rgba(0,0,0,0.4);"
            >
              <span id="home-leaderboard-title"></span>
              <span id="leaderboard-loader" class="hidden"></span>
            </button>

            <!-- TAS Ban List Tab Button -->
            <button
              id="tab-btn-banlist"
              onclick="switchMainTab('banlist')"
              style="padding:0.4em 1em;font-size:1.1em;font-weight:bold;background:rgba(255,255,255,0.05);color:#9a9a9a;border:1px solid rgba(255,255,255,0.15);cursor:pointer;display:inline-flex;align-items:center;gap:0.4em;"
            >
              TAS Ban List (<span id="banlist-count">0</span>)
            </button>
          </div>

          <div class="text-sm text-slate-400 max-w-sm text-right" id="status-message">
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse whitespace-nowrap">
            <thead id="table-header-global">
              <tr class="bg-white/[0.02] border-b border-white/[0.05] text-slate-400 text-sm tracking-wide">
                <th class="p-4 font-semibold cursor-pointer hover:text-white transition-colors" onclick="requestSort('rank')">
                  <div class="flex items-center gap-1" id="table-rank"></div>
                </th>
                <th class="p-4 font-semibold" id="table-player"></th>
                <th class="p-4 font-semibold text-right cursor-pointer hover:text-white transition-colors" onclick="requestSort('newPtsBase')">
                  <div class="flex items-center justify-end gap-1"><span id="table-base"></span> <span id="icon-arrow-1"></span></div>
                </th>
                <th class="p-4 font-semibold text-right cursor-pointer hover:text-white transition-colors" onclick="requestSort('newPtsSkill')">
                  <div class="flex items-center justify-end gap-1"><span id="table-skill"></span> <span id="icon-arrow-2"></span></div>
                </th>
                <th class="p-4 font-semibold text-right cursor-pointer hover:text-white transition-colors" onclick="requestSort('newPtsTotal')">
                  <div class="flex items-center justify-end gap-1 text-emerald-400"><span id="table-total"></span> <span id="icon-arrow-3"></span></div>
                </th>
              </tr>
            </thead>

            <thead id="table-header-banlist" class="hidden">
              <tr class="bg-white/[0.02] border-b border-white/[0.05] text-slate-400 text-sm tracking-wide">
                <th class="p-4 font-semibold">#</th>
                <th class="p-4 font-semibold" id="table-banned-player">Заблокированный игрок</th>
                <th class="p-4 font-semibold text-right" id="table-banned-status">Статус</th>
              </tr>
            </thead>

            <tbody id="leaderboard-body">
              <tr>
                <td colspan="5" class="p-4 text-center text-slate-500" id="empty-state"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div id="load-more-container" class="p-4 border-t border-white/[0.05] text-center bg-white/[0.02] mt-4 rounded-xl hidden">
          <button 
            id="load-more-btn"
            class="px-6 py-2 bg-primary/20 text-primary border border-primary/50 hover:bg-primary/30 rounded-full font-semibold transition-colors disabled:opacity-50"
          >
          </button>
        </div>
      </section>
    </div>
  </main>

  <script src="data/maps.js"></script>
  <script src="data/unique_players.js"></script>
  <script src="data/leaderboard.js"></script>
  <script src="data/map_records.js"></script>
  <script src="data/map_stats.js"></script>
  <script src="data/blacklist.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    let playersData = [];
    let sortConfig = { key: 'newPtsTotal', direction: 'desc' };
    let displayLimit = 10;
    let loading = false;
    let searchLoading = false;

    function getLoadMoreBtnText(limit) {
      if (limit < 20) {
        return currentLang === 'en' ? 'Load 10 to 20' : 'Загрузить с 10 до 20';
      } else if (limit < 40) {
        return currentLang === 'en' ? 'Load 20 to 40' : 'Загрузить с 20 до 40';
      } else if (limit < 100) {
        return currentLang === 'en' ? 'Load 40 to 100' : 'Загрузить с 40 до 100';
      }
      return '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('home');
      
      const dict = getDict();
      document.documentElement.lang = currentLang;

      // Set texts
      document.getElementById('home-title').textContent = dict.home.title;
      document.getElementById('home-subtitle').textContent = dict.home.subtitle;
      document.getElementById('home-about-btn').textContent = dict.home.aboutBtn;
      document.getElementById('home-compare-btn').textContent = dict.home.compareBtn;
      document.getElementById('home-how-it-works').textContent = dict.home.howItWorks;
      document.getElementById('home-base-pts-title').textContent = dict.home.basePtsTitle;
      document.getElementById('home-base-pts-desc').textContent = dict.home.basePtsDesc;
      document.getElementById('home-skill-pts-title').textContent = dict.home.skillPtsTitle;
      document.getElementById('home-skill-pts-desc').textContent = dict.home.skillPtsDesc;
      
      document.getElementById('home-skill-pts-and').textContent = currentLang === 'en' ? 'and record' : 'и рекорда';
      document.getElementById('home-skill-pts-where').textContent = currentLang === 'en' ? 'Where' : 'Где';
      document.getElementById('home-skill-pts-and2').textContent = currentLang === 'en' ? 'and' : 'и';
      document.getElementById('home-skill-pts-s-desc').textContent = currentLang === 'en' ? 'dynamic strictness coefficient (0.5 to 3.0 based on variance)' : 'динамический коэффициент строгости (от 0.5 до 3.0 в зависимости от дисперсии)';

      document.getElementById('search-title').textContent = currentLang === 'en' ? 'Find Player' : 'Найти игрока';
      document.getElementById('home-leaderboard-title').textContent = dict.home.leaderboardTitle;
      document.getElementById('table-rank').textContent = dict.home.tableRank;
      document.getElementById('table-player').textContent = dict.home.tablePlayer;
      document.getElementById('table-base').textContent = dict.home.tableBase;
      document.getElementById('table-skill').textContent = dict.home.tableSkill;
      document.getElementById('table-total').textContent = dict.home.tableTotal;
      document.getElementById('empty-state').textContent = dict.home.empty;
      document.getElementById('status-message').textContent = '';
      document.getElementById('load-more-btn').textContent = getLoadMoreBtnText(displayLimit);

      // Set Icons
      document.getElementById('icon-arrow-right-1').innerHTML = icons.arrowRight;
      document.getElementById('icon-arrow-right-2').innerHTML = icons.arrowRight;
      document.getElementById('icon-arrow-1').innerHTML = icons.arrowUpDown;
      document.getElementById('icon-arrow-2').innerHTML = icons.arrowUpDown;
      document.getElementById('icon-arrow-3').innerHTML = icons.arrowUpDown;
      document.getElementById('search-btn').innerHTML = icons.search;
      document.getElementById('leaderboard-loader').innerHTML = icons.loader;

      // Render Math
      katex.render("P_{total} = P_{base} + P_{skill}", document.getElementById('math-1'), { displayMode: true });
      katex.render("P_{base} = P_{DDNet}", document.getElementById('math-2'), { displayMode: false });
      katex.render("t_{player}", document.getElementById('math-3'), { displayMode: false });
      katex.render("t_{best}", document.getElementById('math-4'), { displayMode: false });
      katex.render("P_{skill} = \\lfloor P_{max\\_bonus} \\times e^{-s(\\frac{t_{player}}{t_{best}} - 1)} \\rfloor", document.getElementById('math-5'), { displayMode: true });
      katex.render("P_{max\\_bonus} = P_{DDNet} \\times 5", document.getElementById('math-6'), { displayMode: false });
      katex.render("s", document.getElementById('math-7'), { displayMode: false });

      // Search Logic
      document.getElementById('player-search-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const val = document.getElementById('search-input').value.trim();
        if (!val) return;

        const btn = document.getElementById('search-btn');
        btn.innerHTML = icons.loader;
        btn.disabled = true;
        document.getElementById('search-error').classList.add('hidden');
        document.getElementById('search-result').classList.add('hidden');

        let res = playersData.find(p => p.name === val);
        try {
          if (!res) {
            res = await window.api.fetchPlayerPts(val);
          }
          document.getElementById('search-result-name').textContent = res.name;
          document.getElementById('search-result-name').href = `player.html?name=${encodeURIComponent(res.name)}`;
          document.getElementById('search-result-base').textContent = '+' + res.newPtsBase.toLocaleString();
          document.getElementById('search-result-skill').textContent = '+' + res.newPtsSkill.toLocaleString();
          document.getElementById('search-result-total').textContent = res.newPtsTotal.toLocaleString();
          document.getElementById('search-result').classList.remove('hidden');
        } catch (err) {
          const errEl = document.getElementById('search-error');
          if (err.isBlacklisted || (window.isBlacklisted && window.isBlacklisted(val))) {
            errEl.textContent = currentLang === 'en' 
              ? 'Player is blacklisted (TAS / Cheating)' 
              : 'Игрок заблокирован в системе (TAS / Читы)';
          } else {
            errEl.textContent = currentLang === 'en' ? 'Player not found' : 'Игрок не найден';
          }
          errEl.classList.remove('hidden');
        } finally {
          btn.innerHTML = icons.search;
          btn.disabled = false;
        }
      });

      document.getElementById('load-more-btn').addEventListener('click', () => {
        if (displayLimit < 20) {
          displayLimit = 20;
        } else if (displayLimit < 40) {
          displayLimit = 40;
        } else {
          displayLimit = 100;
        }
        loadLeaderboard();
      });

      setupPlayerAutocomplete('search-input', (selectedPlayer) => {
        const form = document.getElementById('player-search-form');
        if (form) {
          form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        }
      });

      const banlist = window.blacklistData || [];
      document.getElementById('banlist-count').textContent = banlist.length;

      loadLeaderboard();
    });

    let currentTab = 'global';

    window.switchMainTab = function(tab) {
      currentTab = tab;
      const btnGlobal = document.getElementById('tab-btn-global');
      const btnBanlist = document.getElementById('tab-btn-banlist');
      const headGlobal = document.getElementById('table-header-global');
      const headBanlist = document.getElementById('table-header-banlist');
      const loadMoreContainer = document.getElementById('load-more-container');

      if (tab === 'global') {
        btnGlobal.style.background = '#ffa500';
        btnGlobal.style.color = '#111111';
        btnGlobal.style.border = 'none';

        btnBanlist.style.background = 'rgba(255,255,255,0.05)';
        btnBanlist.style.color = '#9a9a9a';
        btnBanlist.style.border = '1px solid rgba(255,255,255,0.15)';

        headGlobal.classList.remove('hidden');
        headBanlist.classList.add('hidden');

        if (displayLimit < 100 && playersData.length >= displayLimit) {
          loadMoreContainer.classList.remove('hidden');
        }
        renderTable();
      } else {
        btnBanlist.style.background = '#ef4444';
        btnBanlist.style.color = '#ffffff';
        btnBanlist.style.border = 'none';

        btnGlobal.style.background = 'rgba(255,255,255,0.05)';
        btnGlobal.style.color = '#9a9a9a';
        btnGlobal.style.border = '1px solid rgba(255,255,255,0.15)';

        headGlobal.classList.add('hidden');
        headBanlist.classList.remove('hidden');

        loadMoreContainer.classList.add('hidden');
        renderBanlistTable();
      }
    };

    function renderBanlistTable() {
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';

      const list = window.blacklistData || [];
      document.getElementById('banlist-count').textContent = list.length;
      document.getElementById('table-banned-player').textContent = currentLang === 'en' ? 'Banned Player' : 'Заблокированный игрок';
      document.getElementById('table-banned-status').textContent = currentLang === 'en' ? 'Status' : 'Статус';

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500">${currentLang === 'en' ? 'No banned players' : 'Список бана пуст'}</td></tr>`;
        return;
      }

      list.forEach((name, idx) => {
        const tr = document.createElement('tr');
        tr.className = "premium-table-row transition-colors";
        tr.innerHTML = `
          <td class="p-4 font-mono text-slate-400 text-sm">#${idx + 1}</td>
          <td class="p-4 font-bold">
            <a href="player.html?name=${encodeURIComponent(name)}" class="text-red-400 hover:text-red-300 transition-colors">
              ${escapeHtml(name)}
            </a>
          </td>
          <td class="p-4 text-right">
            <span class="px-2.5 py-1 rounded bg-red-500/20 text-red-400 border border-red-500/40 text-xs font-bold uppercase tracking-wider">
              ${currentLang === 'en' ? 'Banned' : 'Заблокирован'}
            </span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function loadLeaderboard() {
      loading = true;
      document.getElementById('leaderboard-loader').classList.remove('hidden');
      document.getElementById('load-more-btn').disabled = true;
      document.getElementById('load-more-btn').innerHTML = icons.loader;
      
      try {
        playersData = await window.api.getTopPlayersLive(displayLimit, (done, total) => {
          document.getElementById('status-message').textContent = `${currentLang === 'en' ? 'Loading' : 'Загрузка'} ${done} / ${total}...`;
        });
        document.getElementById('status-message').textContent = '';
        renderTable();
      } catch (err) {
        document.getElementById('empty-state').textContent = 'Error loading data';
      } finally {
        loading = false;
        document.getElementById('leaderboard-loader').classList.add('hidden');
        document.getElementById('load-more-btn').disabled = false;
        document.getElementById('load-more-btn').textContent = getLoadMoreBtnText(displayLimit);
        
        if (displayLimit < 100 && playersData.length >= displayLimit) {
          document.getElementById('load-more-container').classList.remove('hidden');
        } else {
          document.getElementById('load-more-container').classList.add('hidden');
        }
      }
    }

    window.requestSort = function(key) {
      if (key === 'rank') {
        sortConfig = { key: 'newPtsTotal', direction: 'desc' };
      } else {
        let direction = 'desc';
        if (sortConfig.key === key && sortConfig.direction === 'desc') {
          direction = 'asc';
        }
        sortConfig = { key, direction };
      }
      renderTable();
    }

    function renderTable() {
      if (currentTab !== 'global') return;
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';
      
      if (playersData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">${getDict().home.empty}</td></tr>`;
        return;
      }

      const sortedData = [...playersData].sort((a, b) => {
        const aVal = a[sortConfig.key] || 0;
        const bVal = b[sortConfig.key] || 0;
        if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
        if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
        return 0;
      });

      sortedData.slice(0, displayLimit).forEach((p, idx) => {
        const tr = document.createElement('tr');
        tr.className = "premium-table-row";
        
        // Premium rank styling
        let rankHtml = `<span class="text-slate-500 font-mono">#${idx + 1}</span>`;
        if (idx === 0) rankHtml = `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/50 px-2 py-0.5 rounded-md font-bold text-sm shadow-[0_0_10px_rgba(251,191,36,0.3)]">#1</span>`;
        if (idx === 1) rankHtml = `<span class="bg-slate-300/20 text-slate-300 border border-slate-300/50 px-2 py-0.5 rounded-md font-bold text-sm">#2</span>`;
        if (idx === 2) rankHtml = `<span class="bg-amber-700/20 text-amber-600 border border-amber-700/50 px-2 py-0.5 rounded-md font-bold text-sm">#3</span>`;

        tr.innerHTML = `
          <td class="p-4">${rankHtml}</td>
          <td class="p-4 font-bold text-lg">
            <a href="player.html?name=${encodeURIComponent(p.name)}" class="text-white hover:text-blue-400 transition-colors">
              ${escapeHtml(p.name)}
            </a>
          </td>
          <td class="p-4 text-right font-mono text-emerald-400/80">${p.newPtsBase.toLocaleString()}</td>
          <td class="p-4 text-right font-mono text-purple-400/80">${p.newPtsSkill.toLocaleString()}</td>
          <td class="p-4 text-right font-mono font-bold text-amber-400 text-lg">${p.newPtsTotal.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
