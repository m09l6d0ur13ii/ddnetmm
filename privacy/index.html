  <!-- Main Content -->

    <div id="breadcrumbs-container" class="mb-4"></div>
    <div class="glass-panel p-8 sm:p-10 space-y-8 rounded-2xl border border-white/10 bg-slate-900/40 backdrop-blur-md">

      <div>
        <h1 id="privacy-title" class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mb-2">
          Privacy Policy
        </h1>
        <p id="privacy-last-updated" class="text-slate-400 text-sm">

      </div>

      <hr class="border-white/10">

      <section class="space-y-4">
        <h2 id="sec1-title" class="text-xl font-bold text-slate-100">1. General Provisions</h2>
        <p id="sec1-text" class="text-slate-300 leading-relaxed text-sm sm:text-base"></p>
      </section>

      <section class="space-y-4">
        <h2 id="sec2-title" class="text-xl font-bold text-slate-100">2. Data Collected</h2>
        <p id="sec2-text1" class="text-slate-300 leading-relaxed text-sm sm:text-base"></p>

          <li id="sec2-item2"></li>

          <li id="sec2-item4"></li>
        </ul>
      </section>

      <section class="space-y-4">
        <h2 id="sec3-title" class="text-xl font-bold text-slate-100">3. Use of Cookies and Third-Party Services</h2>
        <p id="sec3-text" class="text-slate-300 leading-relaxed text-sm sm:text-base"></p>
        <div class="bg-white/5 p-4 rounded-xl border border-white/5 space-y-3">
          <div>
            <h3 id="sec3-yandex-title" class="font-semibold text-white"></h3>

            <p id="sec3-rsya-text" class="text-slate-400 text-sm"></p>

        </div>
      </section>

      <section class="space-y-4">
        <h2 id="sec4-title" class="text-xl font-bold text-slate-100">4. Data Security</h2>
        <p id="sec4-text" class="text-slate-300 leading-relaxed text-sm sm:text-base"></p>

      <section class="space-y-4">

        <h2 id="sec6-title" class="text-xl font-bold text-slate-100">6. Contacts & Feedback</h2>

  <!-- Footer -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="../data/maps.js"></script>
  <script defer src="../js/i18n.js"></script>
  <script defer src="../js/components/autocomplete.js?v=1"></script>
  <script defer src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initLang();
      renderHeader('privacy');
      renderFooter('privacy');

      const dict = getDict();
      const p = dict.privacy || {};
      const isEn = currentLang === 'en';

      document.title = `${p.title || 'Privacy Policy'} — DDNet Map Mastery`;

      if (typeof renderBreadcrumbs === 'function') {
        const homeLabel = dict.breadcrumbs ? dict.breadcrumbs.home : (isEn ? 'Home' : 'Главная');
        const privacyLabel = dict.breadcrumbs ? dict.breadcrumbs.privacy : (isEn ? 'Privacy Policy' : 'Политика конфиденциальности');
        renderBreadcrumbs([
          { label: homeLabel, url: '/' },
          { label: privacyLabel }
        ]);
      }

      const setTxt = (id, text) => {
        const el = document.getElementById(id);
        if (el && text) el.textContent = text;
      };

      setTxt('privacy-title', p.title);
      setTxt('privacy-last-updated', p.lastUpdated);
      setTxt('sec1-title', p.sec1Title);
      setTxt('sec1-text', p.sec1Text);
      setTxt('sec2-title', p.sec2Title);
      setTxt('sec2-text1', p.sec2Text1);
      setTxt('sec2-text2', p.sec2Text2);
      setTxt('sec2-item1', p.sec2Item1);
      setTxt('sec2-item2', p.sec2Item2);
      setTxt('sec2-item3', p.sec2Item3);
      setTxt('sec2-item4', p.sec2Item4);
      setTxt('sec3-title', p.sec3Title);
      setTxt('sec3-text', p.sec3Text);
      setTxt('sec3-yandex-title', p.sec3YandexTitle);
      setTxt('sec3-yandex-text', p.sec3YandexText);
      setTxt('sec3-rsya-title', p.sec3RsyaTitle);
      setTxt('sec3-rsya-text', p.sec3RsyaText);
      setTxt('sec4-title', p.sec4Title);
      setTxt('sec4-text', p.sec4Text);
      setTxt('sec5-title', p.sec5Title);
      setTxt('sec5-text', p.sec5Text);
      setTxt('sec6-title', p.sec6Title);
      setTxt('sec6-text', p.sec6Text);
    });
  </script>
