<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Profile — DDNet Map Mastery</title>
  <meta name="description" content="Профиль игрока DDNet Map Mastery — статистика Base PTS, Skill PTS и Total Mastery.">
  <link rel="icon" type="image/png" href="icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ffa500',
          }
        }
      }
    }
  </script>
</head>
<body class="antialiased text-slate-200 font-sans min-h-screen" style="background-color:#2d2d2d;">
  <div id="header-container"></div>

  <main class="min-h-screen p-4 md:p-8 animate-fade-in">
    <div id="loading" class="text-center py-20">
      <div id="loader-icon" class="inline-block text-primary"></div>
      <p class="mt-4 text-slate-400" id="player-loading"></p>
    </div>

    <div id="error" class="text-center py-20 hidden">
      <h2 class="text-2xl font-bold text-red-500" id="player-error"></h2>
    </div>

    <div id="content" class="hidden space-y-8">

      <!-- Header -->
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div>
          <div class="flex items-center gap-3 mb-2 flex-wrap">
            <a href="index.html" class="text-sm text-blue-400 hover:text-blue-300 transition-colors inline-block whitespace-nowrap">
              &larr; <span id="player-back"></span>
            </a>
            <span class="text-slate-600">|</span>
            <!-- Quick Player Search Form -->
            <form id="inline-player-search-form" class="flex items-center gap-1">
              <input
                type="text"
                id="inline-player-search-input"
                placeholder=""
                style="padding:0.35em 0.7em;font-size:0.85em;background:#111111;color:#ffffff;border:1px solid #ffa500;width:15em;box-sizing:border-box;font-weight:600;"
              />
              <button
                type="submit"
                id="inline-player-search-btn"
                style="padding:0.35em 0.8em;font-size:0.85em;background:#ffa500;color:#111;border:none;font-weight:bold;cursor:pointer;white-space:nowrap;"
              >
              </button>
            </form>
          </div>

          <header class="space-y-2">
            <h1 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400" id="player-name"></h1>
            <p class="text-primary font-medium tracking-wide uppercase text-sm" id="player-title"></p>
          </header>
        </div>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="glass-panel p-6 flex flex-col justify-center items-center gap-2">
            <div class="text-sm text-slate-300 font-bold uppercase tracking-wider" id="stat-base"></div>
            <div class="text-3xl font-black font-mono text-emerald-400" id="val-base"></div>
          </div>
          <div class="glass-panel p-6 flex flex-col justify-center items-center gap-2">
            <div class="text-sm text-slate-300 font-bold uppercase tracking-wider" id="stat-skill"></div>
            <div class="text-3xl font-black font-mono text-purple-400" id="val-skill"></div>
          </div>
          <div class="gold-card p-6 flex flex-col justify-center items-center gap-2">
            <div class="text-sm text-amber-400 font-bold uppercase tracking-wider" id="stat-total"></div>
            <div class="text-4xl font-black font-mono text-amber-400" id="val-total"></div>
          </div>
        </div>
      </div>

      <!-- Maps List -->
      <div class="glass-panel overflow-hidden mt-12">
        <div class="p-6 md:p-8 border-b border-white/[0.05]">
          <h2 class="text-2xl font-bold flex items-center gap-3" id="player-maps-title"></h2>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse whitespace-nowrap">
            <thead>
              <tr class="bg-white/[0.02] border-b border-white/[0.05] text-slate-400 text-sm tracking-wide">
                <th class="p-4 font-semibold" id="table-map"></th>
                <th class="p-4 font-semibold" id="table-server"></th>
                <th class="p-4 font-semibold text-right" id="table-time"></th>
                <th class="p-4 font-semibold text-right" id="table-base-col"></th>
                <th class="p-4 font-semibold text-right" id="table-skill-col"></th>
                <th class="p-4 font-semibold text-center" id="table-top-col"></th>
              </tr>
            </thead>
            <tbody id="maps-body">
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="data/maps.js"></script>
  <script src="data/unique_players.js"></script>
  <script src="data/leaderboard.js"></script>
  <script src="data/map_records.js"></script>
  <script src="data/map_stats.js"></script>
  <script src="data/blacklist.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/page-player.js"></script>
</body>
</html>
