<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDNet Map Mastery - Compare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
          }
        }
      }
    }
  </script>
</head>
<body class="antialiased text-slate-200 bg-[#0A0E17] font-sans selection:bg-primary/30 min-h-screen">
  <div id="header-container"></div>

  <main class="min-h-screen p-8 text-slate-200">
    <div class="max-w-6xl mx-auto space-y-12">
      
      <div class="mb-4">
        <a href="index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition-colors">
          <span id="icon-arrow-left"></span> <span id="compare-back">На главную</span>
        </a>
      </div>

      <header class="text-center space-y-4">
        <h1 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400" id="compare-title">
        </h1>
        <p class="text-lg text-slate-400 max-w-3xl mx-auto" id="compare-desc">
        </p>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8" id="scenarios-container">
        <!-- Rendered by JS -->
      </div>

    </div>
  </main>

  <script src="data/leaderboard.js"></script>
  <script src="data/map_records.js"></script>
  <script src="data/map_stats.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Helper to simulate DDNet points drop-off
    function getDDNetPts(rank, maxPts) {
      if (rank === 1) return maxPts;
      if (rank === 2) return Math.floor(maxPts * 0.8);
      if (rank === 3) return Math.floor(maxPts * 0.65);
      if (rank <= 5) return Math.floor(maxPts * 0.5);
      if (rank <= 10) return Math.floor(maxPts * 0.3);
      if (rank <= 20) return Math.floor(maxPts * 0.1);
      return 0;
    }

    // Our exponential formula
    function getMasteryPts(tBest, tPlayer, s, maxPts) {
      const timeRatio = tPlayer / tBest;
      return Math.floor(maxPts * Math.exp(-s * (Math.max(1, timeRatio) - 1)));
    }

    function generateScenario(name, desc, tBest, s, maxPts, players) {
      const labels = [];
      const ddnetData = [];
      const masteryData = [];

      players.forEach((time, index) => {
        const rank = index + 1;
        labels.push(time > 60 ? `${Math.floor(time/60)}m ${Math.floor(time%60)}s` : `${time.toFixed(1)}s`);
        ddnetData.push(getDDNetPts(rank, maxPts));
        masteryData.push(getMasteryPts(tBest, time, s, maxPts));
      });

      return { name, desc, labels, ddnetData, masteryData };
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('compare');
      
      const dict = getDict();
      document.documentElement.lang = currentLang;

      document.getElementById('icon-arrow-left').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>';
      
      document.getElementById('compare-back').textContent = dict.about.back; // Reusing back text
      document.getElementById('compare-title').textContent = dict.compare.title;
      document.getElementById('compare-desc').textContent = dict.compare.desc;

      const scenarios = [
        generateScenario(dict.compare.scenarios[0].name, dict.compare.scenarios[0].desc, 10.0, 3.0, 100, [10.0, 10.1, 10.2, 10.3, 10.4, 10.5, 10.6, 10.7, 10.8, 10.9]),
        generateScenario(dict.compare.scenarios[1].name, dict.compare.scenarios[1].desc, 120.0, 2.0, 500, [120, 121, 122, 123, 124, 125, 128, 130, 131, 132, 133, 134, 135, 136, 137, 138, 139, 140, 141, 142]),
        generateScenario(dict.compare.scenarios[2].name, dict.compare.scenarios[2].desc, 7200.0, 0.5, 1000, [7200, 9000, 9500, 10000, 11000, 12000, 14000, 15000, 18000, 20000]),
        generateScenario(dict.compare.scenarios[3].name, dict.compare.scenarios[3].desc, 30.0, 2.5, 200, [30.00, 30.01, 31.0, 32.0, 33.0, 34.0, 35.0, 36.0, 37.0, 38.0]),
        generateScenario(dict.compare.scenarios[4].name, dict.compare.scenarios[4].desc, 300.0, 1.5, 300, [300, 305, 310])
      ];

      const container = document.getElementById('scenarios-container');

      Chart.defaults.color = '#94a3b8';
      Chart.defaults.font.family = 'sans-serif';

      scenarios.forEach((scenario, i) => {
        const div = document.createElement('div');
        div.className = "bg-slate-900/50 rounded-xl p-6 border border-slate-800 flex flex-col";
        div.innerHTML = `
          <div class="mb-6">
            <h2 class="text-xl font-bold text-blue-400 mb-2">${scenario.name}</h2>
            <p class="text-sm text-slate-400">${scenario.desc}</p>
          </div>
          <div class="flex-1 h-64 min-h-[250px] relative">
            <canvas id="chart-${i}"></canvas>
          </div>
        `;
        container.appendChild(div);

        const ctx = document.getElementById(`chart-${i}`).getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: scenario.labels,
            datasets: [
              {
                label: 'Vanilla DDNet',
                data: scenario.ddnetData,
                borderColor: '#ef4444',
                backgroundColor: '#ef4444',
                stepped: true, // stepAfter
                borderWidth: 2,
                pointRadius: 4,
                pointHoverRadius: 6
              },
              {
                label: 'Map Mastery',
                data: scenario.masteryData,
                borderColor: '#10b981',
                backgroundColor: '#10b981',
                tension: 0.4, // monotone
                borderWidth: 3,
                pointRadius: 4,
                pointHoverRadius: 6
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'top',
                labels: { color: '#cbd5e1' }
              },
              tooltip: {
                backgroundColor: '#0f172a',
                borderColor: '#334155',
                borderWidth: 1,
                titleColor: '#94a3b8',
                bodyColor: '#fff',
                padding: 10
              }
            },
            scales: {
              x: {
                grid: { color: '#334155', tickColor: 'transparent' },
                ticks: { color: '#64748b' }
              },
              y: {
                grid: { color: '#334155' },
                ticks: { color: '#64748b' }
              }
            }
          }
        });
      });
    });
  </script>
</body>
</html>
